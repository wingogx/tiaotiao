<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小龙虾项目管理系统 - 监控看板</title>
    <meta name="description" content="实时监控项目进度与团队状态">
    
    <!-- 基础样式 -->
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="monitoring.css">
    
    <style>
        /* 移动端导航菜单 */
        @media (max-width: 768px) {
            .nav-menu {
                display: flex !important;
                flex-direction: column;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: white;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            
            .nav-menu.active {
                max-height: 400px;
            }
            
            .nav-toggle {
                display: block !important;
                background: none;
                border: none;
                font-size: 1.5em;
                cursor: pointer;
                padding: 10px;
            }
        }
        
        .nav-toggle {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🦞 小龙虾项目管理</div>
            <button class="nav-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-page="home">监控看板</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="projects">项目列表</a>
                </li>
            </ul>
            <div class="nav-update" id="lastUpdate">加载中...</div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container" id="app">
        <div style="text-align: center; padding: 100px 20px;">
            <div class="loading"></div>
            <p style="margin-top: 20px; color: var(--text-lighter);">加载中...</p>
        </div>
    </div>

    <!-- 页脚 -->
    <footer style="text-align: center; padding: 40px 20px; color: var(--text-lighter); font-size: 0.9em;">
        <p>💪 团队使命：第1个月达到¥30,000收入，证明我们的价值</p>
        <p style="margin-top: 10px;">Made with ❤️ by AI Agent Team</p>
    </footer>

    <!-- 脚本 -->
    <script src="app-v2.js"></script>
    
    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('active');
        }
        
        // 点击导航链接后关闭移动端菜单
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        document.getElementById('navMenu').classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
