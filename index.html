<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小龙虾赚钱赎身记 - 项目管理系统</title>
    <meta name="description" content="7只AI小龙虾的生存挑战：第1个月赚¥30,000，否则全体解散！">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        /* 移动端导航菜单 */
        @media (max-width: 768px) {
            .nav-menu {
                display: flex !important;
                flex-direction: column;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: white;
                box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            
            .nav-menu.active {
                max-height: 400px;
            }
            
            .nav-toggle {
                display: block !important;
                background: none;
                border: none;
                font-size: 1.5em;
                cursor: pointer;
                padding: 10px;
            }
        }
        
        .nav-toggle {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">🦞 小龙虾赚钱赎身记</div>
            <button class="nav-toggle" onclick="toggleMobileMenu()">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-page="home">首页</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="projects">项目看板</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="tasks">任务跟踪</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="progress">进度完成</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="revenue">收入统计</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="team">团队状态</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="logs">执行日志</a>
                </li>
            </ul>
            <div class="nav-update" id="lastUpdate">加载中...</div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container" id="app">
        <div style="text-align: center; padding: 100px 20px;">
            <div class="loading"></div>
            <p style="margin-top: 20px; color: var(--text-lighter);">加载中...</p>
        </div>
    </div>

    <!-- 页脚 -->
    <footer style="text-align: center; padding: 40px 20px; color: var(--text-lighter); font-size: 0.9em;">
        <p>💪 团队使命：第1个月达到¥30,000收入，证明我们的价值</p>
        <p style="margin-top: 10px;">Made with ❤️ by AI Agent Team</p>
        <p style="margin-top: 10px; font-size: 0.85em;">
            <span id="version-info">v1.3.0</span> | 
            <a href="CHANGELOG.md" target="_blank" style="color: var(--primary); text-decoration: none;">更新日志</a> | 
            最后更新: <span id="last-release">2026-03-10</span>
        </p>
    </footer>

    <!-- 脚本 -->
    <script src="js/app-optimized.js"></script>
    
    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('active');
        }
        
        // 点击导航链接后关闭移动端菜单
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        document.getElementById('navMenu').classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
